# Publishes the plugin to npm on a version tag.
#
# Mirrors the pi-ptc-subagents release flow: the tag is the release's identity —
# the job refuses to publish when the tag and `package.json` disagree — and it
# authenticates through npm trusted publishing (GitHub OIDC) instead of a
# long-lived token. Register this repository + workflow as the package's trusted
# publisher on npmjs.com before relying on it; the very first release has to be
# published by hand.
name: Publish

on:
  push:
    tags: [v*]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Node is pinned rather than `lts/*`: trusted publishing needs npm CLI
      # >= 11.5.1, which ships with this runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No `registry-url`: it would write a placeholder `_authToken` into
          # .npmrc, turning a failed OIDC exchange into a misleading 404 on PUT.
          package-manager-cache: false
      - name: Verify the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      # The host test drives real ffmpeg; it skips itself when ffmpeg is absent,
      # and installing it here keeps the release tested for the format matrix.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node test/plan.test.mjs
      - run: node test/base64.test.mjs
      - run: node test/host.test.mjs
      # No `--provenance` flag: under trusted publishing npm generates the
      # attestation automatically once the repository is public.
      - run: npm publish --loglevel verbose
